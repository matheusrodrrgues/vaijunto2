x-servidor-base: &servidor-base
  build:
    context: .
    dockerfile: Dockerfile.servidor
  restart: unless-stopped

services:
  empresa-a:
    <<: *servidor-base
    environment:
      VAIJUNTO_EMPRESA_ID: empresa-a
      VAIJUNTO_EMPRESA_NOME: Empresa A
      VAIJUNTO_ADDR: :9000
      VAIJUNTO_REST_ADDR: :8080
      VAIJUNTO_REST_TIMEOUT: 2s
      VAIJUNTO_PARES: empresa-b=http://empresa-b:8080,empresa-c=http://empresa-c:8080
      VAIJUNTO_DADOS_DIR: /app/dados
      VAIJUNTO_LOGS_DIR: /app/logs
    ports:
      - "9001:9000"
      - "8081:8080"
    volumes:
      - ./dados/empresa-a:/app/dados
      - ./logs/empresa-a:/app/logs

  empresa-b:
    <<: *servidor-base
    environment:
      VAIJUNTO_EMPRESA_ID: empresa-b
      VAIJUNTO_EMPRESA_NOME: Empresa B
      VAIJUNTO_ADDR: :9000
      VAIJUNTO_REST_ADDR: :8080
      VAIJUNTO_REST_TIMEOUT: 2s
      VAIJUNTO_PARES: empresa-a=http://empresa-a:8080,empresa-c=http://empresa-c:8080
      VAIJUNTO_DADOS_DIR: /app/dados
      VAIJUNTO_LOGS_DIR: /app/logs
    ports:
      - "9002:9000"
      - "8082:8080"
    volumes:
      - ./dados/empresa-b:/app/dados
      - ./logs/empresa-b:/app/logs

  empresa-c:
    <<: *servidor-base
    environment:
      VAIJUNTO_EMPRESA_ID: empresa-c
      VAIJUNTO_EMPRESA_NOME: Empresa C
      VAIJUNTO_ADDR: :9000
      VAIJUNTO_REST_ADDR: :8080
      VAIJUNTO_REST_TIMEOUT: 2s
      VAIJUNTO_PARES: empresa-a=http://empresa-a:8080,empresa-b=http://empresa-b:8080
      VAIJUNTO_DADOS_DIR: /app/dados
      VAIJUNTO_LOGS_DIR: /app/logs
    ports:
      - "9003:9000"
      - "8083:8080"
    volumes:
      - ./dados/empresa-c:/app/dados
      - ./logs/empresa-c:/app/logs

  motorista:
    build:
      context: .
      dockerfile: Dockerfile.motorista
    environment:
      VAIJUNTO_SERVER: empresa-a:9000
    stdin_open: true
    tty: true
    depends_on:
      - empresa-a

  cliente:
    build:
      context: .
      dockerfile: Dockerfile.cliente
    environment:
      VAIJUNTO_SERVER: empresa-a:9000
    stdin_open: true
    tty: true
    depends_on:
      - empresa-a
